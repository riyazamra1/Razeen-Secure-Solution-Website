<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090a0f">
<meta name="description" content="RSS Puzzle Quest — mobile match-3 puzzle game by Razeen Secure Solution.">
<title>RSS Puzzle Quest</title>
<style>
:root{--bg:#080a10;--panel:#111522;--panel2:#171b2a;--gold:#ffd45f;--gold2:#ff9f43;--text:#f7f8fb;--muted:#9da6ba;--line:rgba(255,255,255,.1);--cell:min(11.4vw,64px);--gap:min(1.4vw,7px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#29304b 0,#0d1019 38%,#07080d 75%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}body{display:flex;justify-content:center}.app{width:100%;max-width:520px;min-height:100svh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 8px}.brand{font-weight:950;letter-spacing:.05em}.brand span{color:var(--gold)}.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;width:40px;height:40px;border-radius:14px;font-size:19px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:16px;padding:9px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.18)}.stat b{display:block;font-size:18px}.stat small{font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.timer{margin:10px 0 8px;height:8px;border-radius:99px;background:#24293a;overflow:hidden}.timer i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--gold),#ff7d54);transition:width .1s linear}.timer-label{text-align:center;font-size:11px;color:var(--muted);margin-bottom:5px}.board-wrap{position:relative;margin:5px auto 12px;padding:10px;border-radius:24px;background:linear-gradient(145deg,#20263a,#0e111b);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.08);touch-action:none}.board{display:grid;grid-template-columns:repeat(7,var(--cell));grid-auto-rows:var(--cell);gap:var(--gap);justify-content:center}.cell{border:0;border-radius:13px;position:relative;display:grid;place-items:center;font-size:clamp(18px,5vw,30px);font-weight:900;box-shadow:inset 0 3px 6px rgba(255,255,255,.35),inset 0 -5px 8px rgba(0,0,0,.18),0 4px 8px rgba(0,0,0,.22);transition:transform .14s,filter .14s,opacity .14s}.cell:active{transform:scale(.9)}.c0{background:linear-gradient(145deg,#ff7283,#d93565)}.c1{background:linear-gradient(145deg,#67b7ff,#3975e9)}.c2{background:linear-gradient(145deg,#71e8a0,#24aa73)}.c3{background:linear-gradient(145deg,#ffe276,#f5a928)}.c4{background:linear-gradient(145deg,#c993ff,#7a55df)}.c5{background:linear-gradient(145deg,#ff9b68,#e85832)}.selected{outline:3px solid #fff;filter:brightness(1.2);transform:scale(1.06);z-index:2}.special{box-shadow:0 0 0 2px #fff,inset 0 0 18px rgba(255,255,255,.45),0 0 18px rgba(255,210,80,.45)}.special:after{content:'✦';position:absolute;font-size:12px;top:2px;right:4px;color:#fff;text-shadow:0 0 6px #fff}.matched{animation:pop .24s ease forwards}@keyframes pop{50%{transform:scale(1.25);filter:brightness(1.8)}100%{transform:scale(.1);opacity:0}}.drop{animation:drop .25s ease}@keyframes drop{from{transform:translateY(-18px);opacity:.2}to{transform:translateY(0);opacity:1}}.message{height:28px;text-align:center;font-weight:900;color:var(--gold);font-size:14px;opacity:0;transform:translateY(6px);transition:.2s}.message.show{opacity:1;transform:none}.boosters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:3px 0 12px}.boost{border:1px solid var(--line);background:linear-gradient(145deg,#1b2030,#10131d);color:#fff;border-radius:16px;padding:9px 4px;font-size:18px}.boost b{display:block;font-size:9px;color:var(--muted);margin-top:3px}.boost:active{transform:scale(.96)}.boost.active{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,80,.18)}.play{width:100%;border:0;border-radius:18px;padding:14px;background:linear-gradient(100deg,var(--gold),var(--gold2));color:#17120a;font-size:15px;font-weight:950;box-shadow:0 10px 25px rgba(255,170,50,.18)}.hint{font-size:10px;color:var(--muted);text-align:center;padding:10px 0 12px}.overlay{position:fixed;inset:0;background:rgba(4,5,9,.78);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}.overlay.open{display:flex}.modal{width:min(420px,100%);background:linear-gradient(145deg,#1a1f30,#0e111a);border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:25px;text-align:center;box-shadow:0 25px 80px #000}.modal h2{margin:0 0 7px;color:var(--gold)}.modal p{color:var(--muted);line-height:1.6;font-size:13px}.modal .play{margin-top:8px}.confetti{position:fixed;pointer-events:none;font-size:22px;z-index:30;animation:conf 900ms ease forwards}@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
@media(min-width:520px){:root{--cell:60px;--gap:7px}.app{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">RSS <span>PUZZLE QUEST</span></div><button class="icon-btn" id="sound" aria-label="Toggle sound">🔊</button></header>
<section class="stats"><div class="stat"><b id="score">0</b><small>Score</small></div><div class="stat"><b id="moves">30</b><small>Moves</small></div><div class="stat"><b id="level">1</b><small>Level</small></div></section>
<div class="timer" aria-label="Time remaining"><i id="timebar"></i></div><div class="timer-label">SPEED PLAY · <span id="time">60</span>s</div>
<div class="board-wrap"><div id="board" class="board" aria-label="Puzzle board"></div></div>
<div id="message" class="message"></div>
<section class="boosters" aria-label="Boosters"><button class="boost" data-boost="hammer">🔨<b>HAMMER</b></button><button class="boost" data-boost="shuffle">🔀<b>SHUFFLE</b></button><button class="boost" data-boost="bomb">💥<b>BOMB</b></button><button class="boost" data-boost="color">🌈<b>COLOR</b></button></section>
<button id="newgame" class="play">NEW GAME</button>
<div class="hint">Match 3+ · 4 creates a line special · 5 in a row creates a super special · chain combos for bonus points.</div>
</div>
<div id="overlay" class="overlay"><div class="modal"><h2 id="resultTitle">Level Complete!</h2><p id="resultText"></p><button id="again" class="play">PLAY AGAIN</button></div></div>
<script>
(()=>{
const N=7,types=6;let board=[],selected=null,score=0,moves=30,level=1,time=60,interval=null,locked=false,boost=null,sound=true;
const $=id=>document.getElementById(id),el=$('board');
function rand(){return Math.floor(Math.random()*types)}
function makeBoard(){board=[];for(let r=0;r<N;r++){let row=[];for(let c=0;c<N;c++){let v;do{v=rand()}while((c>=2&&row[c-1].v===v&&row[c-2].v===v)||(r>=2&&board[r-1][c].v===v&&board[r-2][c].v===v));row.push({v,sp:false})}board.push(row)}}
function render(){el.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let b=board[r][c],d=document.createElement('button');d.className='cell c'+b.v+(b.sp?' special':'')+(selected&&selected.r===r&&selected.c===c?' selected':'');d.dataset.r=r;d.dataset.c=c;d.textContent=['◆','●','★','◆','●','★'][b.v];d.setAttribute('aria-label','Puzzle tile');d.onclick=()=>tap(r,c);el.appendChild(d)}}
function tap(r,c){if(locked)return;if(boost){useBoost(r,c);return}if(!selected){selected={r,c};render();return}if(selected.r===r&&selected.c===c){selected=null;render();return}if(Math.abs(selected.r-r)+Math.abs(selected.c-c)!==1){selected={r,c};render();return}swap(selected.r,selected.c,r,c,true);selected=null}
function swap(r1,c1,r2,c2,turn){let t=board[r1][c1];board[r1][c1]=board[r2][c2];board[r2][c2]=t;render();if(turn)resolveSwap(r1,c1,r2,c2)}
function findMatches(){let set=new Set(),groups=[];for(let r=0;r<N;r++){let s=0;for(let c=1;c<=N;c++){if(c<N&&board[r][c].v===board[r][s].v)s=c;else{let len=c-s;if(len>=3){let g=[];for(let x=s;x<c;x++)g.push([r,x]);groups.push(g);g.forEach(x=>set.add(x.join(',')))}s=c}}}for(let c=0;c<N;c++){let s=0;for(let r=1;r<=N;r++){if(r<N&&board[r][c].v===board[s][c].v)s=r;else{let len=r-s;if(len>=3){let g=[];for(let x=s;x<r;x++)g.push([x,c]);groups.push(g);g.forEach(x=>set.add(x.join(',')))}s=r}}}return{set,groups}}
function resolveSwap(r1,c1,r2,c2){let m=findMatches();if(!m.set.size){swap(r1,c1,r2,c2,false);return}moves--;locked=true;clearMatches(m,0).then(()=>{locked=false;checkEnd()})}
function clearMatches(m,combo){if(!m.set.size)return Promise.resolve();let arr=[...m.set].map(s=>s.split(',').map(Number));let bonus=arr.length*10*(combo+1);let special=null;for(const g of m.groups){if(g.length>=5)special=g[Math.floor(g.length/2)];else if(g.length===4&&!special)special=g[1]}score+=bonus+(combo?combo*50:0);$('score').textContent=score;$('moves').textContent=moves;msg(combo?`COMBO ×${combo+1}! +${bonus}`:`+${bonus} POINTS`);arr.forEach(([r,c])=>{let d=el.children[r*N+c];if(d)d.classList.add('matched')});return new Promise(res=>setTimeout(()=>{arr.forEach(([r,c])=>board[r][c]=null);if(special){board[special[0]][special[1]]={v:board[arr[0][0]][arr[0][1]]?.v??rand(),sp:true}}drop();res()},230)).then(()=>new Promise(res=>setTimeout(()=>{let n=findMatches();if(n.set.size)clearMatches(n,combo+1).then(res);else res()},180)))}
function drop(){for(let c=0;c<N;c++){let vals=[];for(let r=N-1;r>=0;r--)if(board[r][c])vals.push(board[r][c]);for(let r=N-1;r>=0;r--)board[r][c]=vals[N-1-r]||{v:rand(),sp:false};}render()}
function checkEnd(){if(moves<=0||time<=0){finish(false)}else if(score>=level*1500){finish(true)}}
function finish(win){clearInterval(interval);$('resultTitle').textContent=win?'LEVEL COMPLETE!':'TIME / MOVES OVER';$('resultText').textContent=`Score ${score.toLocaleString()} · Level ${level}. ${win?'Great chain! Your next level is ready.':'Tap play again to start a fresh round.'}`;$('overlay').classList.add('open');if(win)burst()}
function newGame(){clearInterval(interval);score=0;moves=30;level=1;time=60;locked=false;selected=null;boost=null;$('score').textContent=0;$('moves').textContent=30;$('level').textContent=1;$('time').textContent=60;$('timebar').style.width='100%';$('overlay').classList.remove('open');makeBoard();render();interval=setInterval(()=>{time--; $('time').textContent=time;$('timebar').style.width=(time/60*100)+'%';if(time<=0)finish(false)},1000)}
function msg(t){let m=$('message');m.textContent=t;m.classList.add('show');clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('show'),850)}
function useBoost(r,c){let b=boost;boost=null;document.querySelectorAll('.boost').forEach(x=>x.classList.remove('active'));locked=true;if(b==='shuffle'){for(let i=0;i<40;i++){let a=Math.floor(Math.random()*N*N),q=Math.floor(Math.random()*N*N),ar=Math.floor(a/N),ac=a%N,br=Math.floor(q/N),bc=q%N;let t=board[ar][ac];board[ar][ac]=board[br][bc];board[br][bc]=t}render();msg('BOARD SHUFFLED');locked=false;return}let targets=[];if(b==='hammer')targets=[[r,c]];if(b==='bomb'){for(let rr=Math.max(0,r-1);rr<=Math.min(N-1,r+1);rr++)for(let cc=Math.max(0,c-1);cc<=Math.min(N-1,c+1);cc++)targets.push([rr,cc])}if(b==='color'){let v=board[r][c].v;for(let rr=0;rr<N;rr++)for(let cc=0;cc<N;cc++)if(board[rr][cc].v===v)targets.push([rr,cc])}targets.forEach(([rr,cc])=>board[rr][cc]=null);score+=targets.length*30;$('score').textContent=score;drop();moves--; $('moves').textContent=moves;msg(`${b.toUpperCase()} BOOST!`);setTimeout(()=>{locked=false;checkEnd()},250)}
document.querySelectorAll('.boost').forEach(b=>b.onclick=()=>{if(locked)return;document.querySelectorAll('.boost').forEach(x=>x.classList.remove('active'));boost=b.dataset.boost;b.classList.add('active');msg('Select a tile')});$('newgame').onclick=newGame;$('again').onclick=newGame;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇'};makeBoard();render();newGame();
function burst(){for(let i=0;i<22;i++){let s=document.createElement('i');s.className='confetti';s.textContent=['✦','◆','●','★'][i%4];s.style.left='50%';s.style.top='45%';s.style.setProperty('--x',(Math.random()*300-150)+'px');s.style.setProperty('--y',(Math.random()*420-210)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}
})();
</script>
</body>
</html>
