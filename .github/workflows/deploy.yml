name: Deploy Website to aaPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -n "$DEPLOY_HOST"
          timeout 15 ssh-keyscan -T 5 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts || true

      - name: Deploy to aaPanel
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_PATH"
          SSH_OPTS="-i ~/.ssh/deploy_key -p $DEPLOY_PORT -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
          ssh $SSH_OPTS -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "sudo mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete             --exclude='.git/'             --exclude='.github/'             --exclude='.user.ini'             --rsync-path="sudo rsync"             -e "ssh $SSH_OPTS -o StrictHostKeyChecking=no"             ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
